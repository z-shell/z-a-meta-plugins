version: 0.1
cli:
  version: 1.4.0
plugins:
  sources:
    - id: trunk
      ref: v0.0.8
      uri: https://github.com/trunk-io/plugins
lint:
  definitions:
    # This repository is consumed as a submodule, so `.git` is a file whose
    # gitdir is relative to the superproject. Trunk's sandbox copy breaks that
    # relative path, so anchor the command at the real workspace.
    - name: git-diff-check
      commands:
        - name: lint
          run: git -C "${workspace}" diff --check ${target}
  enabled:
    - git-diff-check
    - markdownlint@0.33.0
    - prettier@2.8.3
    - actionlint@1.6.23
    - gitleaks@8.15.3
    - oxipng@8.0.0
runtimes:
  enabled:
    - go@1.18.3
    - node@18.12.1
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
