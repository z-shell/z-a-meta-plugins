name: Controlled Zd Validation
on:
  workflow_dispatch:
    inputs:
      image:
        description: Qualified Zsh 5.9.2 runtime registry image digest.
        required: true
  workflow_call:
    inputs:
      image:
        description: Qualified Zsh 5.9.2 runtime registry image digest.
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: zd-controlled-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controlled:
    name: Controlled Loader Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable image
        env:
          ZD_IMAGE: ${{ inputs.image }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[0-9a-f]{64}', os.environ['ZD_IMAGE'])
          PY
      - name: Check out repository workload
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: candidate
          persist-credentials: false
      - name: Check out pinned organization tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: z-shell/.github
          ref: 18433229ccbfc9e59332710ee3cc1ba5b920b49c # Reviewed main
          path: org-tools
          persist-credentials: false
      - name: Prepare pinned Zi input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: z-shell/zi
          ref: 8448b4a2323099b3034db9b40b598eef702ae9b2
          path: zi
          persist-credentials: false
      - name: Execute repository tests and loader benchmark
        id: execution
        uses: ./org-tools/actions/run-zd
        with:
          zd-ref: 7c52bb894cc93d3bfcd2e0f6a359aa8ff0d45490 # Reviewed main
          image: ${{ inputs.image }}
          profile: runtime
          source: ${{ github.workspace }}/candidate
          fixtures: '{"zi":"${{ github.workspace }}/zi"}'
          mode: benchmark
          cpuset: "0"
          command: '["python3", "scripts/zd-check.py", "--benchmark"]'
          artifact-name: zd-loader-execution
      - name: Validate and present comparison
        if: always() && steps.execution.outputs.evidence-directory != ''
        uses: ./org-tools/actions/benchmark-report
        with:
          root: ${{ steps.execution.outputs.evidence-directory }}
          report: execution/comparison.json
          artifact-name: zd-loader-report
