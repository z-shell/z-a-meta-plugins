---
name: Zsh Lint

on:
  push:
    branches: [main]
    paths:
      - "z-a-meta-plugins.plugin.zsh"
      - "functions/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  pull_request:
    branches: [main]
    paths:
      - "z-a-meta-plugins.plugin.zsh"
      - "functions/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Configured Zsh Lint
    uses: z-shell/.github/.github/workflows/zsh-lint.yml@dc233851b57784314f99ce5099ea00fc05dc303d # main
    with:
      # zsh-lint discovers zsh-lint.json upward from each input, so the
      # configured profile applies without an explicit --config flag.
      paths: |
        z-a-meta-plugins.plugin.zsh
        functions
      zsh-lint-ref: aff60185cddb4b829f39f2db82aae9fc7bce3e7d # v1.4.0
      config: zsh-lint.json
