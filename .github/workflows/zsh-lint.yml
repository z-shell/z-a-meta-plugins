---
name: Zsh Lint

on:
  push:
    branches: [main]
    paths:
      - "z-a-meta-plugins.plugin.zsh"
      - "functions/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  pull_request:
    branches: [main]
    paths:
      - "z-a-meta-plugins.plugin.zsh"
      - "functions/**"
      - ".github/workflows/zsh-lint.yml"
      - "zsh-lint.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zsh-lint:
    name: Configured Zsh Lint
    uses: z-shell/.github/.github/workflows/zsh-lint.yml@main
    with:
      # zsh-lint discovers zsh-lint.json upward from each input, so the
      # configured profile applies without an explicit --config flag.
      paths: |
        z-a-meta-plugins.plugin.zsh
        functions
      zsh-lint-ref: 999cb76cc65ef6af56c0ae65ab0f3622eb527944 # v1.3.0
